# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/arandu-whatsapp"
framework = ">= 0.45"
profiles = ["conventional"]

[permissions]
# WhatsApp connections and configured webhook deliveries leave the process.
network = true
# Multipart media and transcoding use bounded temporary files.
filesystem = true
# Audio and thumbnail processing invoke the configured ffmpeg/ffprobe binaries.
exec = true
# The module owns its domain tables and delegates the WhatsMeow store upgrade,
# so installers have to run `aru migrate` before starting it.
migrations = true
