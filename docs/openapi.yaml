                  pattern: '^https?://'
                thumbnailUrl:
                  type: string
                  format: uri
                  pattern: '^https?://'
                  nullable: true
                title:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
    SendMediaRequest:
      allOf:
        - $ref: '#/components/schemas/RecipientFields'
        - type: object
          required:
