      type: object
      required:
        - statusCode
        - status
        - message
        - processId
        - instanceName
      properties:
        statusCode:
          type: integer
          example: 202
        status:
          type: string
          example: processing
        message:
          type: string
        processId:
          type: string
        instanceName:
          type: string
    ErrorResponse:
      type: object
      required:
        - statusCode
        - error
        - messages
      properties:
        statusCode:
          type: integer
        error:
          type: string
        code:
          type: string
        messages:
          type: array
          items:
            type: string
    MentionAllSendMessageWebhookData:
      type: object
