      properties:
        processId:
          type: string
        status:
          type: string
          enum:
            - sent
            - failed
        mentionAll:
          type: boolean
        data:
          type: object
          properties:
            messageId:
              type: string
            remoteJid:
              type: string
            participantCount:
              type: integer
            timestamp:
              type: string
              format: date-time
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - INSTANCE_NOT_CONNECTED
                - GROUP_INFO_FETCH_FAILED
                - GROUP_HAS_NO_PARTICIPANTS
                - MESSAGE_SEND_FAILED
                - GROUP_MENTION_PROCESSING_FAILED
            message:
              type: string
        externalAttributes:
          type: object
          additionalProperties: true
