      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [requestId, state, expiresAt, publicKey]
          properties:
            requestId: {type: string, format: uuid}
            state: {$ref: '#/components/schemas/PasskeyState'}
            expiresAt: {type: string, format: date-time}
            publicKey:
              $ref: '#/components/schemas/WebAuthnPublicKey'
    PasskeyAssertionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [state, message]
          properties:
            state: {$ref: '#/components/schemas/PasskeyState'}
            message: {type: string}
    PasskeyState:
      type: string
      enum: [IDLE, FETCHING_CHALLENGE, AWAITING_ASSERTION, SUBMITTING_ASSERTION, AWAITING_CONFIRMATION, CONFIRMATION_SENT, COMPLETED, FAILED]
    WebAuthnPublicKey:
      type: object
      required: [challenge, timeout, rpId, allowCredentials, userVerification, extensions]
      properties:
        challenge: {type: string}
        timeout: {type: integer}
        rpId: {type: string}
        allowCredentials:
          type: array
          nullable: true
          items:
            type: object
            required: [id, type, transports]
            properties:
              id: {type: string}
              type: {type: string}
              transports:
                type: array
                items: {type: string}
        userVerification: {type: string}
        extensions:
          type: object
          nullable: true
          additionalProperties: true
    ConnectionStateEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [state, statusReason, instanceName, connectionStatus, connected, loggedIn, ownerJid]
          properties:
            state: {type: string}
            statusReason: {type: integer, enum: [200, 503]}
            instanceName: {type: string}
            connectionStatus: {type: string, enum: [offline, connecting, qr_code, pairing_code, pairing, online, reconnecting, disconnected, connection_timeout, logged_out, session_missing, stream_replaced, keepalive_timeout, client_outdated, temporary_ban, connection_error]}
            connected: {type: boolean}
            loggedIn: {type: boolean}
            ownerJid: {type: string, nullable: true}
    LogoutEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [instanceName, state, connectionStatus, message]
          properties:
            instanceName: {type: string}
            state: {type: string}
            connectionStatus: {type: string, enum: [LOGGED_OUT]}
            message: {type: string}
