            - paused
        quotedMessageId:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          nullable: true
        quotedMessage:
          type: object
          nullable: true
          additionalProperties: true
        externalAttributes:
          type: object
          nullable: true
          additionalProperties: true
