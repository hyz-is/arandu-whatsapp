        creation: {type: integer, format: int64}
        owner: {type: string}
        desc: {type: string}
        descId: {type: string}
        restrict: {type: boolean}
        announce: {type: boolean}
        isCommunity: {type: boolean}
        isCommunityAnnounce: {type: boolean}
        joinApprovalMode: {type: boolean}
        memberAddMode: {type: boolean}
        participants:
          type: array
          items: {$ref: '#/components/schemas/GroupParticipant'}
    GroupParticipant:
      type: object
      required: [id, isAdmin, isSuperAdmin]
      properties:
        id: {type: string}
        phoneNumber: {type: string}
