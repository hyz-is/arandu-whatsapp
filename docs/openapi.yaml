          $ref: '#/components/schemas/AudioMessageOptions'
        audioMessage:
          type: object
          required:
            - audio
          properties:
            audio:
              type: string
              format: uri
              pattern: '^https?://'
    SendWhatsAppAudioFileRequest:
      type: object
      required:
        - number
        - attachment
      properties:
        number:
          type: string
          minLength: 1
        delay:
          type: integer
          format: int64
          minimum: 0
          maximum: 300000
        presence:
          type: string
          enum: [recording, paused]
        quotedMessageId:
          type: integer
          format: int64
        quotedMessage:
          type: string
        mentionAll:
          type: boolean
        attachment:
          type: string
          format: binary
    SendContactRequest:
      allOf:
        - $ref: '#/components/schemas/RecipientFields'
        - type: object
          required:
            - contactMessage
          properties:
            options:
              $ref: '#/components/schemas/MessageOptions'
            contactMessage:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ContactMessage'
    ContactMessage:
      type: object
      required:
        - fullName
      properties:
        fullName:
          type: string
          minLength: 1
        wuid:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          minLength: 1
        organization:
          type: string
          nullable: true
        vcard:
          type: string
          minLength: 1
      anyOf:
        - required: [vcard]
        - required: [wuid]
        - required: [phoneNumber]
    SendLocationRequest:
      allOf:
        - $ref: '#/components/schemas/RecipientFields'
        - type: object
          required:
            - locationMessage
          properties:
            options:
              $ref: '#/components/schemas/MessageOptions'
            locationMessage:
              $ref: '#/components/schemas/LocationMessage'
    LocationMessage:
      type: object
      required:
        - latitude
        - longitude
      properties:
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    SendReactionRequest:
      type: object
      required:
        - reactionMessage
