      type: object
      required: [id, keyId, keyRemoteJid, keyLid, keyFromMe, keyParticipant, keyParticipantLid, pushName, messageType, content, messageTimestamp, device, isGroup, instanceId]
      properties:
        id: {type: integer, format: int64}
        keyId: {type: string}
        keyRemoteJid: {type: string, nullable: true}
        keyLid: {type: string, nullable: true}
        keyFromMe: {type: boolean}
        keyParticipant: {type: string, nullable: true}
        keyParticipantLid: {type: string, nullable: true}
        pushName: {type: string, nullable: true}
        messageType: {type: string}
        content:
          type: object
          additionalProperties: true
        messageTimestamp: {type: integer, format: int32}
        device:
          type: string
          enum: [ios, android, web, unknown, desktop]
        isGroup: {type: boolean, nullable: true}
        instanceId: {type: integer, format: int64}
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        externalAttributes:
          type: object
          additionalProperties: true
