      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [instanceName, deleted, forced, message]
          properties:
            instanceName: {type: string}
            deleted: {type: boolean}
            forced: {type: boolean}
            message: {type: string}
    QRCodeConnectionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [count, code, base64, instanceName, connectionStatus, alreadyConnected, alreadyConnecting, ownerJid]
          properties:
            count: {type: integer}
            code: {type: string}
            base64: {type: string}
            instanceName: {type: string}
            connectionStatus: {type: string}
            alreadyConnected: {type: boolean}
            alreadyConnecting: {type: boolean}
            ownerJid: {type: string, nullable: true}
